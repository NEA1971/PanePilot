name: Release

# Ein Release entsteht automatisch, sobald auf main eine neue Versionsnummer
# (src/panepilot/__init__.py) zusammen mit docs/releases/v<version>.md liegt
# und es für diese Version noch kein Release gibt. Tag und Release legt der
# Workflow selbst an.
on:
  push:
    branches: [main]
    paths:
      - "src/panepilot/__init__.py"
      - "docs/releases/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 file
      - name: Python-Pakete
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Version und Release-Beschreibung ermitteln
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import sys; sys.path.insert(0, "src"); import panepilot; print(panepilot.__version__)')
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ ! -f "docs/releases/$TAG.md" ]; then
            echo "Keine Release-Beschreibung docs/releases/$TAG.md – kein Release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: appimagetool holen
        if: steps.ver.outputs.skip == 'false'
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage bauen
        if: steps.ver.outputs.skip == 'false'
        run: packaging/build_appimage.sh "$PWD/appimagetool"
      - name: AppImage kurz starten (ohne Bildschirm)
        if: steps.ver.outputs.skip == 'false'
        env:
          QT_QPA_PLATFORM: offscreen
          PANEPILOT_CONFIG_DIR: /tmp/pp-smoke
        run: |
          set +e
          timeout 10 dist/PanePilot-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          test $code -eq 124 || { echo "AppImage ist beim Start abgebrochen (Code $code)"; exit 1; }
      - name: Release veröffentlichen
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" dist/PanePilot-*-x86_64.AppImage \
            --target "$GITHUB_SHA" \
            --title "PanePilot $TAG" \
            --notes-file "docs/releases/$TAG.md" \
            $(case "$TAG" in v0.*) echo --prerelease ;; *) echo --latest ;; esac)
