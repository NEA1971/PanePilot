name: Pakete testen

# Baut AppImage, .deb und .rpm ohne Release (v2.0) – von Hand über „Run workflow“ oder gh workflow run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 file \
            desktop-file-utils appstream zsync
      - name: Desktop-Datei und AppStream-Metadaten prüfen
        run: |
          desktop-file-validate packaging/panepilot.desktop
          appstreamcli validate --no-net --explain packaging/io.github.nea1971.panepilot.appdata.xml
      - name: Python-Pakete
        run: python -m pip install -r requirements-dev.txt
      - name: appimagetool holen
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: AppImage bauen
        run: packaging/build_appimage.sh "$PWD/appimagetool"
      - name: AppImage kurz starten (ohne Bildschirm)
        env:
          QT_QPA_PLATFORM: offscreen
          PANEPILOT_CONFIG_DIR: /tmp/pp-smoke
        run: |
          set +e
          timeout 10 dist/PanePilot-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          test $code -eq 124 || { echo "AppImage ist beim Start abgebrochen (Code $code)"; exit 1; }
      - name: .deb und .rpm bauen (v2.0)
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          packaging/build_packages.sh
          dpkg-deb -I dist/PanePilot-*-amd64.deb
          rpm -qip dist/PanePilot-*-x86_64.rpm
          rpm -qpR dist/PanePilot-*-x86_64.rpm
      - name: .deb installieren und kurz starten (ohne Bildschirm)
        env:
          QT_QPA_PLATFORM: offscreen
          PANEPILOT_CONFIG_DIR: /tmp/pp-smoke-deb
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/PanePilot-*-amd64.deb
          test -x /usr/bin/panepilot && test -f /usr/share/applications/panepilot.desktop
          desktop-file-validate /usr/share/applications/panepilot.desktop
          set +e
          timeout 10 panepilot
          code=$?
          test $code -eq 124 || { echo "Paket-Version ist beim Start abgebrochen (Code $code)"; exit 1; }
          set -e
          sudo apt-get remove -y panepilot
          test ! -e /opt/panepilot/PanePilot
      - name: Pakete als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: pakete
          path: |
            dist/PanePilot-*-amd64.deb
            dist/PanePilot-*-x86_64.rpm
          retention-days: 3

  rpm-installieren:
    needs: appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:41", "opensuse/tumbleweed"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pakete
      - name: .rpm installieren und kurz starten (ohne Bildschirm)
        env:
          QT_QPA_PLATFORM: offscreen
          PANEPILOT_CONFIG_DIR: /tmp/pp-smoke-rpm
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False ./PanePilot-*-x86_64.rpm coreutils
          else
            zypper --non-interactive install --allow-unsigned-rpm --no-recommends ./PanePilot-*-x86_64.rpm
          fi
          test -x /usr/bin/panepilot
          set +e
          timeout 10 panepilot
          code=$?
          test $code -eq 124 || { echo "rpm-Version ist beim Start abgebrochen (Code $code)"; exit 1; }
