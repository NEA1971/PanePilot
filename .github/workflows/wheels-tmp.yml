name: wheels-tmp
on:
  push:
    branches: [tools/wheels]
jobs:
  videotest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 \
            ffmpeg libimage-exiftool-perl mkvtoolnix
          mkvpropedit --version; exiftool -ver; ffmpeg -version | head -1
      - run: python -m pip install -r requirements-dev.txt
      - env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs tests/test_v150.py tests/test_v140.py tests/test_v093.py
