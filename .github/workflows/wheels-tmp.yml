name: wheels-tmp
on:
  push:
    branches: [tools/wheels]
permissions:
  contents: write
jobs:
  wheels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          mkdir w
          for v in 3.13 3.12; do
            python -m pip download -d w --only-binary=:all: --python-version $v --platform manylinux2014_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_34_x86_64 paramiko secretstorage
          done
          ls -la w
          tar czf wheels.tgz w
          gh release delete wheels-tmp -R ${{ github.repository }} -y --cleanup-tag || true
          gh release create wheels-tmp wheels.tgz -R ${{ github.repository }} --draft --target tools/wheels -t wheels-tmp -n tmp
        env:
          GH_TOKEN: ${{ github.token }}
