name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Zusatzprogramme (ffmpeg, exiftool, mkvtoolnix) für die Video-Tests
        run: sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl mkvtoolnix
      - name: Python-Pakete
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
